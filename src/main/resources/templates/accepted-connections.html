<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>My Connections</title>

<link rel="stylesheet" th:href="@{/css/feed.css}">

<style>

/* ===== PAGE WRAPPER ===== */
.followers-wrapper{
    margin-top:0px;
    margin-bottom:280px;
    padding-bottom:80px;
}

/* ===== CONTAINER ===== */
.followers-container{
    max-width:650px;
    margin:0 auto;
    padding:0 20px;
}

/* ===== BACK LINK ===== */
.back-link{
    display:inline-block;
    margin-bottom:25px;
    font-size:14px;
    color:#64748b;
    text-decoration:none;
    font-weight:500;
}

.back-link:hover{
    color:#2563eb;
}

/* ===== HEADER ===== */
.followers-header{
    font-size:24px;
    font-weight:600;
    color:#1f2937;
    margin-bottom:6px;
}

.followers-count{
    font-size:14px;
    color:#6b7280;
    margin-bottom:25px;
}

/* ===== CARD ===== */
.follower-card{
    background:white;
    padding:18px 20px;
    border-radius:16px;
    margin-bottom:15px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    transition:all 0.25s ease;
}

.follower-card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

/* LEFT SECTION */
.left{
    display:flex;
    align-items:center;
    gap:15px;
}

/* ===== AVATAR ===== */
.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:linear-gradient(135deg,#6366f1,#4f46e5);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:600;
    font-size:18px;
}

/* ===== NAME ===== */
.follower-name{
    text-decoration:none;
    font-weight:600;
    color:#111827;
    font-size:16px;
}

.follower-name:hover{
    color:#2563eb;
}

/* ===== BUTTON ===== */
.btn{
    border:none;
    padding:7px 14px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
}


/* REJECT BUTTON */
.reject{
border:none;
padding:8px 16px;
border-radius:7px;
cursor:pointer;
background:#ef4444;
color:white;
font-weight:600;
transition:all 0.25s ease;
}

.reject:hover{
background:#dc2626;
transform:translateY(-2px);
box-shadow:0 6px 14px rgba(0,0,0,0.2);
}

/* ===== EMPTY STATE ===== */
.empty-state{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:40px;
}

.empty-box{
    background:white;	
    padding:40px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    text-align:center;
    max-width:400px;
}

.empty-icon{
    font-size:50px;
    margin-bottom:15px;
}

/* ===== MODAL ===== */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
    width:300px;
}

.modal-buttons{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:15px;
}

.cancel{
    background:#e5e7eb;
}

</style>

</head>

<body>

<!-- HEADER -->
<div th:replace="fragments/header :: header"></div>

<div class="followers-wrapper">
<div class="followers-container">

    <a th:href="@{/feed}" class="back-link">← Back to Feed</a>

    <div class="followers-header">
        My Connections
    </div>

    <div class="followers-count"
         th:if="${!#lists.isEmpty(connections)}"
         th:text="${#lists.size(connections)} + ' connections'">
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(connections)}" class="empty-state">
        <div class="empty-box">
            <div class="empty-icon">🌐</div>
            <h3>No Connections Yet</h3>
            <p>Start connecting with people to grow your network.</p>
        </div>
    </div>

    <!-- Cards -->
    <div th:each="user : ${connections}" class="follower-card">

        <div class="left">
            <div class="avatar"
                 th:text="${#strings.substring(user.username,0,1).toUpperCase()}">
            </div>

            <a th:href="@{/profile/{username}(username=${user.username})}"
               th:text="${user.username}"
               class="follower-name">
            </a>
        </div>

        <form th:action="@{/connections/remove/{username}(username=${user.username})}"
              method="post"
              style="display:inline;">
            <button type="button"
                    class="btn reject"
                    onclick="openRemoveModal(this.closest('form'))">
                Remove
            </button>
        </form>

    </div>

</div>
</div>

<!-- REMOVE CONFIRMATION MODAL -->
<div id="removeModal" class="modal">
    <div class="modal-box">
        <p>Are you sure you want to remove this connection?</p>

        <div class="modal-buttons">
            <button class="btn reject" onclick="confirmRemove()">Yes</button>
            <button class="btn cancel" onclick="closeRemoveModal()">No</button>
        </div>
    </div>
</div>

<!-- FOOTER -->
<div th:replace="fragments/footer :: footer"></div>

<script>

let removeForm = null;

function openRemoveModal(form){
    removeForm = form;
    document.getElementById("removeModal").style.display = "flex";
}

function closeRemoveModal(){
    document.getElementById("removeModal").style.display = "none";
}

function confirmRemove(){
    if(removeForm){
        removeForm.submit();
    }
}

</script>

</body>
</html>

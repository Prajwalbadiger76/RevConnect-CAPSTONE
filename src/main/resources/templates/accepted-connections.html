<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>My Connections</title>

<link rel="stylesheet" th:href="@{/css/connection.css}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">

<style>
.container{
width:75%;
margin:auto;
min-height:400px;
}

.left{
display:flex;
align-items:center;
gap:12px;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:#6366f1;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:18px;
}

.name{
text-decoration:none;
font-weight:600;
color:#111827;
font-size:19px;
transition:0.2s ease;
cursor:pointer;
}

.back{
text-align:center;
margin-top:35px;
}

.back a{
text-decoration:none !important;
color:#2563eb;
font-weight:600;
}

.back a:hover{
color:red;
text-decoration:none !important;
}

.card{
overflow:visible;
position:relative;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header-band">
<h2 class="page-title">My Connections</h2>
</div>

<div class="container">

<div th:if="${#lists.isEmpty(connections)}">
<p style="text-align:center;">No connections yet.</p>
</div>

<div th:each="user : ${connections}" class="card">

<div class="left">
<div class="avatar"
th:text="${#strings.substring(user.username,0,1).toUpperCase()}"></div>

<a class="name"
th:href="@{/profile/{username}(username=${user.username})}"
th:text="${user.username}"></a>
</div>

<!-- ⭐ Direct remove form -->
<form th:action="@{/connections/remove/{username}(username=${user.username})}"
method="post">
<button type="submit" class="remove">Remove</button>
</form>

</div>

<div class="back">
<a th:href="@{/feed}">← Back to Feed</a>
</div>

</div>

</body>
</html>

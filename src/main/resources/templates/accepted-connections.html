<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>My Connections</title>

<link rel="stylesheet" th:href="@{/css/connection.css}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">


</head>

<body>

<div class="container">

    <!-- Back link like Pending page -->
    <a th:href="@{/feed}" class="back-link">← Back to Feed</a>

    <!-- Page header like Pending -->
    <div class="page-header">
        My Connections
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(connections)}" class="empty-state">
        <div class="empty-box">
            <div class="empty-icon">🌐</div>
            <h3>No Connections Yet</h3>
            <p>Start connecting with people to grow your network.</p>
        </div>
    </div>

    <!-- Connection cards -->
    <div th:each="user : ${connections}" class="card">

        <div class="left">
            <div class="avatar"
                 th:text="${#strings.substring(user.username,0,1).toUpperCase()}">
            </div>

            <a class="name"
               th:href="@{/profile/{username}(username=${user.username})}"
               th:text="${user.username}">
            </a>
        </div>

        <form th:action="@{/connections/remove/{username}(username=${user.username})}"
              method="post"
              style="display:inline;">
            <button type="button"
                    class="btn reject"
                    onclick="openRemoveModal(this.closest('form'))">
                Remove
            </button>
        </form>

    </div>

</div>

<!-- REMOVE CONFIRMATION MODAL -->
<div id="removeModal" class="modal">
    <div class="modal-box">
        <p>Are you sure you want to remove this connection?</p>

        <div class="modal-buttons">
            <button class="btn reject" onclick="confirmRemove()">Yes</button>
            <button class="btn cancel" onclick="closeRemoveModal()">No</button>
        </div>
    </div>
</div>

<script>
let removeForm = null;

function openRemoveModal(form){
    removeForm = form;
    document.getElementById("removeModal").style.display = "flex";
}

function closeRemoveModal(){
    document.getElementById("removeModal").style.display = "none";
}

function confirmRemove(){
    if(removeForm){
        removeForm.submit();
    }
}
</script>

</body>
</html>

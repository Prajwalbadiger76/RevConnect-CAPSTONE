<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>RevConnect - Feed</title>
	<link rel="stylesheet" th:href="@{/css/feed.css}">

	<style>

		/* ===== ANALYTICS BAR ===== */
		.analytics-bar {
			display: flex;
			justify-content: space-around;
			align-items: center;
			margin-top: 12px;
			padding: 10px;
			background: linear-gradient(90deg, #eef2ff, #f8f9ff);
			border-radius: 10px;
			font-size: 14px;
			border: 1px solid #e5e8f0;
		}

		.analytics-item {
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.analytics-item span {
			font-weight: 600;
			font-size: 16px;
		}

		.analytics-item small {
			font-size: 11px;
			color: #777;
		}

		

		.filter-btn:hover {
			background: #eef3ff;
		}

		.filter-btn.active {
			background: #e0e7ff;
			font-weight: 600;
		}

		/* ===== TRENDING BUTTON ===== */
		.trending-badge {
		    display: none;
		    margin-left: 10px;
		    padding: 8px 18px;
		    border-radius: 25px;
		    background: linear-gradient(45deg, #ff6a00, #ff3c00);
		    color: white;
		    font-size: 14px;
		    font-weight: 600;
		    text-decoration: none;
		    border: none;
		    box-shadow: 0 6px 15px rgba(255, 80, 0, 0.4);
		    transition: 0.2s ease;
		}

		.trending-badge:hover {
		    transform: scale(1.05);
		}

		/* ===== SIMPLE TRENDING DROPDOWN ===== */
		#trendingBox {
		    position: absolute;
		    top: 45px;
		    left: 0;
		    width: 260px;
		    background: white;
		    border-radius: 12px;
		    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
		    display: none;
		    z-index: 3000;
		    overflow: hidden;
		    border: 1px solid #e5e7eb;
		}

		#trendingBox a {
		    display: block;
		    padding: 10px 14px;
		    text-decoration: none;
		    color: #111827;
		    font-size: 14px;
		    transition: background 0.2s ease;
		}

		#trendingBox a:hover {
		    background: #f9fafb;
		}
		.filter-card {
				    background: #ffffff;
				    border-radius: 18px;
				    padding: 20px;
				    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
				}


				.filter-heading svg {
				    width: 18px;
				    height: 18px;
				}

				.filter-btn {
				    width: 100%;
				    text-align: left;
				    padding: 10px 14px;
				    border-radius: 10px;
				    border: none;
				    background: transparent;
				    cursor: pointer;
				    font-size: 14px;
				    margin-bottom: 8px;
				    transition: 0.2s ease;
				}

				.filter-btn:hover {
				    background: #f1f5f9;
				}

				.filter-btn.active {
				    background: #2563eb;
				    color: white;
				    font-weight: 600;
				}
				
	</style>
</head>
<body>

	<!-- ================= NAVBAR ================= -->

	<div id="overlay" class="overlay" onclick="toggleNotifications()"></div>


	<!-- NAVBAR -->
	<div class="navbar">

		<!-- LEFT -->


		<div class="navbar-right">


			<h2>RevConnect</h2>

			<div style="position:relative;">

				<form th:action="@{/post/search}" method="get" class="search-form">

				    <input type="text"
				           name="keyword"
				           id="searchInput"
				           placeholder="Search users or hashtags..."
				           oninput="handleSearchInput()"
				           autocomplete="off"
				           required>

				    <button type="submit">Search
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
						  <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
						</svg>
					</button>

				    <a id="dynamicTrendingBtn"
				       th:href="@{/post/trending}"
				       class="trending-badge">
				        🔥 Trending Hashtag
				    </a>

				    <div id="trendingBox"></div>

				</form>



			</div>
		</div>

		<!-- RIGHT -->
		<div class="navbar-right">


			<a th:href="@{/connections}">Pending Requests
				<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill-exclamation" viewBox="0 0 16 16">
				  <path d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0m-9 8c0 1 1 1 1 1h5.256A4.5 4.5 0 0 1 8 12.5a4.5 4.5 0 0 1 1.544-3.393Q8.844 9.002 8 9c-5 0-6 3-6 4"/>
				  <path d="M16 12.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0m-3.5-2a.5.5 0 0 0-.5.5v1.5a.5.5 0 0 0 1 0V11a.5.5 0 0 0-.5-.5m0 4a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/>
				</svg>
			</a>
			<a th:href="@{/connections/sent}">Sent Requests
				<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill-check" viewBox="0 0 16 16">
				  <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m1.679-4.493-1.335 2.226a.75.75 0 0 1-1.174.144l-.774-.773a.5.5 0 0 1 .708-.708l.547.548 1.17-1.951a.5.5 0 1 1 .858.514M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
				  <path d="M2 13c0 1 1 1 1 1h5.256A4.5 4.5 0 0 1 8 12.5a4.5 4.5 0 0 1 1.544-3.393Q8.844 9.002 8 9c-5 0-6 3-6 4"/>
				</svg>
			</a>
			<a th:href="@{/connections/accepted}">Connections
				<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-people-fill" viewBox="0 0 16 16">
				  <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
				</svg>
			</a>

			<div class="profile-menu">
				<div class="profile-circle" onclick="toggleProfileMenu()"
					th:text="${#strings.substring(currentUsername,0,1).toUpperCase()}">
				</div>

				<div id="profileDropdown" class="dropdown">
					<a th:href="@{/profile}">My Profile</a>
					<a th:href="@{/api/auth/logout}">Logout</a>
				</div>
			</div>
		</div>

	</div>

	<!-- ================= MAIN LAYOUT ================= -->

	<div class="page-layout">

		<!-- FILTER COLUMN -->
		<div class="filter-column">

			<div class="filter-card">
				<div class="filter-heading">
					Filter Post
					<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-filter" viewBox="0 0 16 16">
						<path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5m-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5"/>
					</svg>
				</div>

				<button class="filter-btn" data-role="ALL" onclick="changeRoleFilter('ALL')">
								    All Posts
								</button>

								<button class="filter-btn" data-role="PERSONAL" onclick="changeRoleFilter('PERSONAL')">
								    Personal
								</button>

								<button class="filter-btn" data-role="CREATOR" onclick="changeRoleFilter('CREATOR')">
								    Creators
								</button>

								<button class="filter-btn" data-role="BUSINESS" onclick="changeRoleFilter('BUSINESS')">
								    Businesses
								</button>

			</div>

		</div>




		<!-- FEED -->
		<div style="margin-top: 6px;" class="feed-container">



			<!-- CREATE POST -->
			<div class="create-post" th:if="${showCreateForm} ">
				<form th:action="@{/post/create}" method="post"onsubmit="return validateUrlBeforeSubmit()">

					<!-- Row 1: Textarea -->
					<div class="create-row">


						<textarea name="content" id="postContent" placeholder="What's on your mind?"
							required></textarea>
							
							
							
							<div th:if="${currentUserRole == 'CREATOR' or currentUserRole == 'BUSINESS'}">

							    <!-- 🔥 Promotional Toggle -->
							    <div class="promo-toggle-wrapper">

							        <!-- Hidden field for backend -->
							        <input type="hidden" name="promotional" id="promoInput" value="false">

							        <label class="toggle-switch">
							            <input type="checkbox"
							                   id="promoToggle"
							                   onchange="togglePromotional(this)">
							            <span class="slider"></span>
							        </label>

							        <span class="toggle-label">Promotional Post</span>

							    </div>

							    <!-- 🔥 Promotional Fields -->
							    <div id="promoFields" class="promo-fields">

							        <select name="ctaType" class="promo-input">
							            <option value="">Select CTA</option>
							            <option value="Learn More">Learn More</option>
							            <option value="Shop Now">Shop Now</option>
							            <option value="Sign Up">Sign Up</option>
							        </select>

							        <input type="text"
							               name="ctaUrl"
							               placeholder="CTA URL"
							               class="promo-input">

							        <input type="text"
							               name="productTag"
							               placeholder="Tag product/service"
							               class="promo-input">

							    </div>

							</div>
					</div>

					<!-- Hashtag Suggestions (outside flex row) -->
					<div id="hashtagSuggestions"></div>

					<!-- Row 2: Hashtag input -->
					<div style="margin-top:15px;">
						<input type="text" name="hashtags" placeholder="Add hashtags (comma separated)"
							style="width:100%; padding:10px; border-radius:12px; border:1px solid #d1d5db;">
					</div>

					<!-- Hidden field -->
					<input type="hidden" name="scheduledAt" id="scheduledAtInput">
					
					<div class="create-divider"></div>

					<!-- Row 3: Buttons -->
					<div class="create-actions">

						<button type="submit">
							Create Post
						</button>

						<button type="button" onclick="openSchedule()" style="background:#111827;">
							Schedule Post
						</button>

					</div>

				</form>
			</div>


			<!-- POSTS -->
			<div th:each="post : ${posts}"
			     th:class="'post-card ' + (${post.promotional} ? 'promo-highlight' : '')">

				<div class="post-top">

					<div class="avatar small">
						<span th:text="${#strings.substring(post.username,0,1).toUpperCase()}"></span>
					</div>

					<div class="post-meta">
						<a th:href="@{/profile/{username}(username=${post.username})}" th:text="${post.username}"></a>

						<span th:text="${#temporals.format(post.createdAt,'dd MMM yyyy HH:mm')}"></span>
						
						<span th:if="${post.promotional}" class="sponsored-inline">
						    • Sponsored
						</span>
					</div>

				</div>

				<!-- SHARE HEADER -->
				<div th:if="${post.sharedFromUsername != null}" class="share-header">
				    🔁 Reposted from 
				    <a th:href="@{/profile/{username}(username=${post.sharedFromUsername})}"
				       th:text="'@' + ${post.sharedFromUsername}">
				    </a>
				</div>

				<!-- POST CONTENT BLOCK -->
				<div class="post-body">
				    <div class="post-content"
				         th:text="${post.content}">
				    </div>
					<div th:if="${post.promotional}" class="promo-section">

					    <div class="product-tag"
					         th:text="${post.productTag}">
					    </div>

						<a th:if="${post.ctaUrl}" 
						   th:href="${post.ctaUrl}" 
						   target="_blank" 
						   class="promo-btn">

						    <!-- Icon based on CTA -->
						    <span th:if="${post.ctaType == 'Learn More'}">🔗</span>
						    <span th:if="${post.ctaType == 'Shop Now'}">🛒</span>
						    <span th:if="${post.ctaType == 'Sign Up'}">✍️</span>

						    <span th:text="${post.ctaType}"></span>

						</a>

					</div>
				</div>
				
				<div th:if="${post.hashtags != null}">
									<span th:each="tag : ${post.hashtags}">
										<a th:href="@{/post/search(keyword=${'#' + tag})}"
											style="color:#2563eb; text-decoration:none; margin-right:8px;">
											<span th:text="${'#' + tag}"></span>
										</a>
									</span>
				</div>				

				<div class="post-actions">

					<form th:action="@{/like/{postId}(postId=${post.id})}" method="post">
						<button th:text="${post.likedByCurrentUser ? '❤️ Unlike' : '🤍 Like'}"></button>
					</form>

					<span th:text="${post.likeCount} + ' likes'"></span>

					<!-- COMMENT COUNT BUTTON -->
					<span class="comment-toggle" th:attr="onclick=|toggleComments(${post.id})|">
						💬 <span th:text="${#lists.size(post.comments)}"></span> Comments
					</span>

					<!-- If NOT shared -->
					<form th:if="${!post.sharedByCurrentUser}"
					      th:action="@{/post/share/{id}(id=${post.id})}"
					      method="post">
					    <button>🔁 Re-Share</button>
					</form>

					<!-- If already shared -->
					<span th:if="${post.sharedByCurrentUser}"
					      style="color:gray; font-weight:500;">
					    🔁 Reposted
					</span>


				</div>

				<div class="comment-section">

					<!-- EXISTING COMMENTS (TOGGLE THIS ONLY) -->
					<div class="comments-list" th:id="'comments-' + ${post.id}" style="display:none;">

						<div th:each="comment : ${post.comments}" class="comment">

							<div class="comment-left">
								<strong>
									<a th:href="@{/profile/{username}(username=${comment.username})}"
										th:text="${comment.username}"></a>
								</strong>
								<span th:text="${comment.content}"></span>
							</div>

							<form th:if="${comment.ownedByCurrentUser}"
								th:action="@{/comment/delete/{commentId}(commentId=${comment.id})}" method="post">
								<button class="delete-btn">Delete</button>
							</form>

						</div>

					</div>

					<!-- COMMENT FORM (ALWAYS VISIBLE) -->
					<div class="comment-form">
						<form th:action="@{/comment/{postId}(postId=${post.id})}" method="post">
							<input type="text" name="content" placeholder="Write a comment..." required>
							<button type="submit">Post</button>
						</form>
					</div>

				</div>

				<div th:if="${currentUserRole == 'CREATOR' or currentUserRole == 'BUSINESS'}" class="analytics-bar">

					<div class="analytics-item">
						👁 <span th:text="${post.reachCount}">0</span>
						<small>Reach</small>
					</div>

					<div class="analytics-item">
						🔁 <span th:text="${post.totalShares}">0</span>
						<small>Shares</small>
					</div>

					<div class="analytics-item">
						📊 <span th:text="${#numbers.formatDecimal(post.engagementRate,1,2)}">0</span>%
						<small>Engagement</small>
					</div>

				</div>

			</div>
		</div>

		<!-- ================= NOTIFICATION SIDEBAR ================= -->

		<div class="notification-sidebar">
					<div class="sidebar-header">

						<span class="sidebar-title">Notifications</span>

						<div class="sidebar-bell">
							🔔
							<sup id="sidebarNotifCount" class="sidebar-badge"></sup>
						</div>

					</div>
					<div class="notif-title">Unread</div>
					<div id="notifUnread"></div>
					<div class="notif-title">History</div>
					<div id="notifRead"></div>
				</div>

			</div>

	</div>

	<script>

		function toggleProfileMenu() {
			document.getElementById("profileDropdown").classList.toggle("show");
		}

		function fetchNotifications() {
							fetch('/notifications')
								.then(res => res.json())
								.then(data => {

									let unread = data.filter(n => !n.read);
									let read = data.filter(n => n.read);

									renderNotifications(unread, read);

									updateSidebarNotificationCount(unread.length);
								});
						}
						
						function updateSidebarNotificationCount(count) {

									const badge = document.getElementById("sidebarNotifCount");

									if (count > 0) {
										badge.innerText = count;
										badge.style.display = "inline-block";
									} else {
										badge.style.display = "none";
									}
								}

				function renderNotifications(unread, read) {

					const unreadBox = document.getElementById("notifUnread");
					const readBox = document.getElementById("notifRead");

					unreadBox.innerHTML = "";
					readBox.innerHTML = "";

					unread.forEach(n => unreadBox.appendChild(createItem(n, true)));
					read.forEach(n => readBox.appendChild(createItem(n, false)));
				}

				function createItem(n, unread) {

					let div = document.createElement("div");
					div.className = "notif-item " + (unread ? "unread" : "read");

					div.innerHTML = `<div class="notif-text">${n.message}</div>`;

					div.onclick = function () {
						fetch('/notifications/read/' + n.id, {method: 'POST'})
							.then(() => fetchNotifications());
					};

					return div;
				}

				setInterval(fetchNotifications, 5000);
				fetchNotifications();

		function toggleComments(postId) {
			let section = document.getElementById("comments-" + postId);
			if (!section) return;
			section.style.display =
				(section.style.display === "none" || section.style.display === "")
					? "block" : "none";
		}
	</script>
	<!-- ================= SCHEDULE ================= -->
	<!-- Schedule Overlay -->
	<div id="scheduleOverlay" class="schedule-overlay">

		<div class="schedule-sheet">

			<h3 style="margin-top:0;">Schedule Post</h3>

			<input type="datetime-local" id="schedulePicker" class="schedule-input">

			<div class="schedule-buttons">
				<button onclick="confirmSchedule()" class="ok-btn">
					OK
				</button>

				<button onclick="closeSchedule()" class="cancel-btn">
					Cancel
				</button>
			</div>

		</div>
	</div>

	<!-- App Popup -->
	<div id="appPopupOverlay" class="app-popup-overlay">
		<div class="app-popup">
			<div id="appPopupMessage"></div>
			<button onclick="closeAppPopup()">OK</button>
		</div>
	</div>



	<script th:inline="javascript">

		let trendingTags = /*[[${trendingHashtags}]]*/[];
		if (!trendingTags) {
			trendingTags = [];
		}

		function handleSearchInput() {

		    let input = document.getElementById("searchInput").value.trim();
		    let box = document.getElementById("trendingBox");
		    let trendingBtn = document.getElementById("dynamicTrendingBtn");

		    if (!input.startsWith("#")) {
		        trendingBtn.style.display = "none";
		        box.style.display = "none";
		        return;
		    }

		    trendingBtn.style.display = "inline-block";

		    let keyword = input.substring(1).toLowerCase();

		    let filtered = trendingTags.filter(tag =>
		        tag.toLowerCase().startsWith(keyword)
		    );

		    if (filtered.length === 0) {
		        box.style.display = "none";
		        return;
		    }

		    box.innerHTML = "";

		    filtered.forEach(tag => {
		        let a = document.createElement("a");

		        // ✅ FIXED HERE
		        a.href = "/post/search?keyword=%23" + tag;

		        a.innerText = "#" + tag;
		        a.style.display = "block";
		        a.style.padding = "8px";
		        a.style.textDecoration = "none";
		        a.style.color = "#111827";

		        box.appendChild(a);
		    });

		    box.style.display = "block";
		}
		document.addEventListener("click", function (event) {

			let searchInput = document.getElementById("searchInput");
			let box = document.getElementById("trendingBox");

			if (!searchInput.contains(event.target) &&
				!box.contains(event.target)) {

				box.style.display = "none";
			}
		});
		/* ==============================
		   POST TEXTAREA HASHTAG SUGGEST
		============================== */
		function suggestHashtags() {

			let textarea = document.getElementById("postContent");
			let value = textarea.value;
			let suggestionBox = document.getElementById("hashtagSuggestions");

			let match = value.match(/#(\w*)$/);

			if (!match) {
				suggestionBox.style.display = "none";
				return;
			}

			let keyword = match[1].toLowerCase();

			let filtered = trendingTags.filter(tag =>
				tag.toLowerCase().startsWith(keyword)
			);

			if (filtered.length === 0) {
				suggestionBox.style.display = "none";
				return;
			}

			suggestionBox.innerHTML = "";

			filtered.forEach(tag => {

				let div = document.createElement("div");
				div.innerText = "#" + tag;
				div.style.padding = "6px";
				div.style.cursor = "pointer";

				div.onclick = function () {
					textarea.value =
						value.replace(/#(\w*)$/, "#" + tag + " ");
					suggestionBox.style.display = "none";
				};

				suggestionBox.appendChild(div);
			});

			suggestionBox.style.display = "block";
		}

	</script>
	<script>

		function openSchedule() {

			let content = document.getElementById("postContent").value.trim();

			// ❌ If content empty
			if (content === "") {
				showAppPopup("Content is required to schedule a post.");
				return;
			}

			// ✅ Show bottom sheet
			document.getElementById("scheduleOverlay").style.display = "flex";
		}

		function closeSchedule() {
			document.getElementById("scheduleOverlay").style.display = "none";
		}

		function confirmSchedule() {

		    let dateTime = document.getElementById("schedulePicker").value;

		    if (!dateTime) {
		        showAppPopup("Please select date and time.");
		        return;
		    }

		    const selectedTime = new Date(dateTime);
		    const currentTime = new Date();

		    if (selectedTime <= currentTime) {
		        showAppPopup("Scheduled time must be in the future.");
		        return;
		    }

		    document.getElementById("scheduledAtInput").value = dateTime;

		    closeSchedule();

		    showToast("Post scheduled successfully!");

		    setTimeout(() => {
		        document.querySelector(".create-post form").submit();
		    }, 800);
		}


		/* =========================
		   APP POPUP (Error Style)
		========================= */

		function showAppPopup(message) {

			document.getElementById("appPopupMessage").innerText = message;
			document.getElementById("appPopupOverlay").style.display = "flex";
		}

		function closeAppPopup() {
			document.getElementById("appPopupOverlay").style.display = "none";
		}


		/* =========================
		   TOAST SUCCESS MESSAGE
		========================= */

		function showToast(message) {

			let toast = document.createElement("div");

			toast.innerText = message;
			toast.style.position = "fixed";
			toast.style.bottom = "30px";
			toast.style.left = "50%";
			toast.style.transform = "translateX(-50%)";
			toast.style.background = "#111827";
			toast.style.color = "white";
			toast.style.padding = "10px 20px";
			toast.style.borderRadius = "20px";
			toast.style.boxShadow = "0 4px 15px rgba(0,0,0,0.3)";
			toast.style.zIndex = "3000";
			toast.style.opacity = "0";
			toast.style.transition = "opacity 0.3s ease";

			document.body.appendChild(toast);

			setTimeout(() => toast.style.opacity = "1", 50);

			setTimeout(() => {
				toast.style.opacity = "0";
				setTimeout(() => toast.remove(), 300);
			}, 2000);
		}


	</script>

	<!--this is the filter type post-->

	<script>
		    function changeRoleFilter(role) {
		        if (role === "ALL")
		            window.location.href = "/feed";
		        else
		            window.location.href = "/feed?role=" + role;
		    }

		    document.addEventListener("DOMContentLoaded", function () {

		        const params = new URLSearchParams(window.location.search);
		        let role = params.get("role");

		        if (!role) role = "ALL";

		        document.querySelectorAll(".filter-btn").forEach(btn => {
		            if (btn.dataset.role === role) {
		                btn.classList.add("active");
		            } else {
		                btn.classList.remove("active");
		            }
		        });

		    });
		</script>
	
	<script>
	function togglePromotional(el) {

	    const hiddenInput = document.getElementById("promoInput");
	    const promoFields = document.getElementById("promoFields");

	    const ctaType = document.querySelector("select[name='ctaType']");
	    const ctaUrl = document.querySelector("input[name='ctaUrl']");
	    const productTag = document.querySelector("input[name='productTag']");

	    if (el.checked) {
	        hiddenInput.value = "true";
	        promoFields.style.display = "block";

	        // Make fields required
	        ctaType.required = true;
	        ctaUrl.required = true;
	        productTag.required = true;

	    } else {
	        hiddenInput.value = "false";
	        promoFields.style.display = "none";

	        // Remove required validation
	        ctaType.required = false;
	        ctaUrl.required = false;
	        productTag.required = false;
	    }
	}
	</script>
	
	<script>
			function validateUrlBeforeSubmit() {

				    const promoInput = document.getElementById("promoInput").value;
				    const urlInput = document.querySelector("input[name='ctaUrl']");

				    if (promoInput === "true") {

				        const url = urlInput.value.trim();

				        const pattern = /^(https?:\/\/)[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}.*$/;

				        if (!pattern.test(url)) {
				            showAppPopup("Please enter a valid URL (http:// or https://)");
				            return false;
				        }
				    }

				    return true;
				}
		</script>

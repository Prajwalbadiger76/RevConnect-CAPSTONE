<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>RevConnect - Feed</title>
	<link rel="stylesheet" th:href="@{/css/feed.css}">

	<style>
		/* ====== PAGE LAYOUT ====== */
		.page-layout {
			display: grid;
			grid-template-columns: 180px 650px 320px;
			gap: 125px;
			justify-content: center;
			padding-top: 20px;
			margin-top: 25px;
		}

		.feed-container {
			width: 650px;
		}




		/* ===== RIGHT SIDEBAR ===== */
		.notification-sidebar {
			width: 320px;
			height: calc(100vh - 80px);
			position: sticky;
			top: 70px;
			background: #ffffff;
			border-radius: 12px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
			padding: 15px;
			overflow-y: auto;
		}

		.sidebar-header {
			font-size: 20px;
			font-weight: 600;
			margin-bottom: 10px;
		}

		.notif-title {
			font-size: 14px;
			color: #666;
			margin: 15px 0 8px 0;
			font-weight: 600;
		}

		.notif-item {
			padding: 12px;
			border-radius: 10px;
			margin-bottom: 8px;
			cursor: pointer;
			transition: 0.2s;
		}

		.notif-item:hover {
			background: #f5f7fb;
		}

		.notif-item.unread {
			background: #eef3ff;
		}

		.notif-item.read {
			background: #fafafa;
		}

		.notif-text {
			font-size: 14px;
		}

		.empty-text {
			font-size: 13px;
			color: #888;
			text-align: center;
		}

		/* ===== ANALYTICS BAR ===== */

		.analytics-bar {
			display: flex;
			justify-content: space-around;
			align-items: center;
			margin-top: 12px;
			padding: 10px;
			background: linear-gradient(90deg, #eef2ff, #f8f9ff);
			border-radius: 10px;
			font-size: 14px;
			border: 1px solid #e5e8f0;
		}

		.analytics-item {
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		.analytics-item span {
			font-weight: 600;
			font-size: 16px;
		}

		.analytics-item small {
			font-size: 11px;
			color: #777;
		}
	</style>

	<style>
		/* FILTER COLUMN POSITION */
		.filter-column {
			position: sticky;
			top: 90px;
			height: fit-content;
		}

		/* FILTER CARD */
		.filter-card {
			background: white;
			border-radius: 14px;
			padding: 15px;
			box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
		}


		/* FILTER BUTTON DEFAULT (VISIBLE DARK BOX) */
		.filter-btn {
			width: 100%;
			text-align: left;
			padding: 12px;
			border-radius: 10px;
			border: none;
			margin-bottom: 10px;

			background: #eef3ff;
			/* Dark solid */
			color: black;
			font-size: 14px;
			cursor: pointer;

			transition: all 0.2s ease;
		}

		/* HOVER */
		.filter-btn:hover {
			background: rgb(185, 193, 208);
		}

		/* SELECTED */
		.filter-btn.active {
			background: linear-gradient(to right, #e0f2fe, #bae6fd);
			color: black;
			font-weight: 600;
			box-shadow: 0 6px 15px rgba(37, 99, 235, 0.4);
		}

		/* ===== TRENDING BUTTON ===== */

		.trending-badge {
			display: none;
			margin-left: 10px;
			padding: 8px 18px;
			border-radius: 25px;
			background: linear-gradient(45deg, #ff6a00, #ff3c00);
			color: white;
			font-size: 14px;
			font-weight: 600;
			text-decoration: none;
			border: none;
			box-shadow: 0 6px 15px rgba(255, 80, 0, 0.4);
			transition: 0.2s ease;
		}

		.trending-badge:hover {
			transform: scale(1.05);
		}


		/* ===== SIMPLE TRENDING DROPDOWN ===== */

		#trendingBox {
			position: absolute;
			top: 45px;
			left: 0;
			width: 260px;
			background: white;
			border-radius: 12px;
			box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
			display: none;
			z-index: 3000;
			overflow: hidden;
			border: 1px solid #e5e7eb;
		}


		#trendingBox a {
			display: block;
			padding: 10px 14px;
			text-decoration: none;
			color: #111827;
			font-size: 14px;
			transition: background 0.2s ease;
		}

		#trendingBox a:hover {
			background: #f9fafb;
		}

		/* notification */

		.sidebar-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 12px 16px;
			border-radius: 12px;
			margin-bottom: 15px;

			/* Attractive soft gradient */
			background: linear-gradient(90deg, #00c6ff, #0072ff);
			font-size: 18px;
			font-weight: 600;
		}

		.sidebar-title {
			color: #111827;
		}

		.sidebar-bell {
			position: relative;
			font-size: 22px;
		}

		.sidebar-badge {
			position: absolute;
			top: -6px;
			right: -10px;
			background: #ef4444;
			color: white;
			font-size: 11px;
			font-weight: 600;
			padding: 2px 6px;
			border-radius: 50px;
			display: none;
			min-width: 18px;
			text-align: center;
		}

		/* FILTER HEADER STYLE */

		.filter-header {
			display: flex;
			justify-content: space-between;
			align-items: center;

			padding: 12px 16px;
			border-radius: 12px;
			margin-bottom: 15px;

			background: linear-gradient(90deg, #00c6ff, #0072ff);

			font-size: 18px;
			font-weight: 600;
			color: black;
		}
	</style>

	<meta charset="UTF-8">
	<title>RevConnect - Feed</title>
	<link rel="stylesheet" th:href="@{/css/feed.css}">
</head>

<body>

	<!-- ================= NAVBAR ================= -->

	<div id="overlay" class="overlay" onclick="toggleNotifications()"></div>


	<!-- NAVBAR -->
	<div class="navbar">

		<!-- LEFT -->


		<div class="navbar-right">
			<!--<a th:href="@{/connections}">Pending</a>
			<a th:href="@{/connections/accepted}">Connections</a>-->


			<h2>RevConnect</h2>

			<div style="position:relative;">

				<form th:action="@{/post/search}" method="get" class="search-form">

					<input type="text" name="keyword" id="searchInput" placeholder="Search users or hashtags..."
						oninput="handleSearchInput()" autocomplete="off" required>
					<a id="dynamicTrendingBtn" href="/post/trending" style="
						        display:none;
						        margin-left:10px;
						        padding:5px 12px;
						        border-radius:15px;
						        background:rgba(255,99,71,0.1);
						        color:#ff5722;
						        text-decoration:none;
						        font-size:13px;">
					</a>

					<a id="dynamicTrendingBtn" th:href="@{/post/trending}" class="trending-badge">
						🔥 Trending Hashtag
					</a>

					<div id="trendingBox"></div>

					<button type="submit">Search</button>
				</form>



			</div>
		</div>

		<!-- RIGHT -->
		<div class="navbar-right">


			<a th:href="@{/connections}">Pending Requests</a>
			<a th:href="@{/connections/sent}">Sent Requests</a>
			<a th:href="@{/connections/accepted}">Connections</a>

			<div class="profile-menu">
				<div class="profile-circle" onclick="toggleProfileMenu()"
					th:text="${#strings.substring(currentUsername,0,1).toUpperCase()}">
				</div>

				<div id="profileDropdown" class="dropdown">
					<a th:href="@{/profile}">My Profile</a>
					<a th:href="@{/logout}">Logout</a>
				</div>
			</div>
		</div>

	</div>

	<!-- ================= MAIN LAYOUT ================= -->

	<div class="page-layout">

		<!-- FILTER COLUMN -->
		<div class="filter-column">

			<div class="filter-card">
				<div class="filter-header">
					<span>Filter Post</span>
				</div>
				<button class="filter-btn" onclick="changeRoleFilter('ALL')">All Posts</button>
				<button class="filter-btn" onclick="changeRoleFilter('PERSONAL')">Personal</button>
				<button class="filter-btn" onclick="changeRoleFilter('CREATOR')">Creators</button>
				<button class="filter-btn" onclick="changeRoleFilter('BUSINESS')">Businesses</button>

			</div>

		</div>




		<!-- FEED -->
		<div style="margin-top: 6px;" class="feed-container">



			<!-- CREATE POST -->
			<div class="create-post" th:if="${showCreateForm} ">
				<form th:action="@{/post/create}" method="post">

					<!-- Row 1: Avatar + Textarea -->
					<div class="create-row">


						<textarea name="content" id="postContent" placeholder="What's on your mind?"
							required></textarea>

					</div>

					<!-- Hashtag Suggestions (outside flex row) -->
					<div id="hashtagSuggestions"></div>

					<!-- Row 2: Hashtag input -->
					<div style="margin-top:15px;">
						<input type="text" name="hashtags" placeholder="Add hashtags (comma separated)"
							style="width:100%; padding:10px; border-radius:12px; border:1px solid #d1d5db;">
					</div>

					<!-- Hidden field -->
					<input type="hidden" name="scheduledAt" id="scheduledAtInput">

					<!-- Row 3: Buttons -->
					<div class="create-actions">

						<button type="submit">
							Create Post
						</button>

						<button type="button" onclick="openSchedule()" style="background:#111827;">
							Schedule Post
						</button>

					</div>

				</form>
			</div>


			<!-- POSTS -->
			<div th:each="post : ${posts}" class="post-card">

				<div class="post-top">

					<div class="avatar small">
						<span th:text="${#strings.substring(post.username,0,1).toUpperCase()}"></span>
					</div>

					<div class="post-meta">
						<a th:href="@{/profile/{username}(username=${post.username})}" th:text="${post.username}"></a>

						<span th:text="${#temporals.format(post.createdAt,'dd MMM yyyy HH:mm')}"></span>
					</div>
				</div>

				<!-- SHARE HEADER -->
				<div th:if="${post.sharedFromUsername != null}" class="share-header">
				    🔁 Re-Shared from 
				    <a th:href="@{/profile/{username}(username=${post.sharedFromUsername})}"
				       th:text="'@' + ${post.sharedFromUsername}">
				    </a>
				</div>

				<!-- POST CONTENT BLOCK -->
				<div class="post-body">
				    <div class="post-content"
				         th:text="${post.content}">
				    </div>
				</div>
				
				<div th:if="${post.hashtags != null}">
									<span th:each="tag : ${post.hashtags}">
										<a th:href="@{/post/search(keyword=${'#' + tag})}"
											style="color:#2563eb; text-decoration:none; margin-right:8px;">
											<span th:text="${'#' + tag}"></span>
										</a>
									</span>
				</div>				

				<div class="post-actions">

					<form th:action="@{/like/{postId}(postId=${post.id})}" method="post">
						<button th:text="${post.likedByCurrentUser ? '❤️ Unlike' : '🤍 Like'}"></button>
					</form>

					<span th:text="${post.likeCount} + ' likes'"></span>

					<!-- COMMENT COUNT BUTTON -->
					<span class="comment-toggle" th:attr="onclick=|toggleComments(${post.id})|">
						💬 <span th:text="${#lists.size(post.comments)}"></span> Comments
					</span>

					<!-- If NOT shared -->
					<form th:if="${!post.sharedByCurrentUser}" th:action="@{/post/share/{id}(id=${post.id})}"
						method="post">
						<button>🔁 Re-Share</button>
					</form>

					<!-- If already shared -->
					<span th:if="${post.sharedByCurrentUser}" style="color:gray; font-weight:500;">
						✔ Re-Shared
					</span>


				</div>

				<div class="comment-section">

					<!-- EXISTING COMMENTS (TOGGLE THIS ONLY) -->
					<div class="comments-list" th:id="'comments-' + ${post.id}" style="display:none;">

						<div th:each="comment : ${post.comments}" class="comment">

							<div class="comment-left">
								<strong>
									<a th:href="@{/profile/{username}(username=${comment.username})}"
										th:text="${comment.username}"></a>
								</strong>
								<span th:text="${comment.content}"></span>
							</div>

							<form th:if="${comment.ownedByCurrentUser}"
								th:action="@{/comment/delete/{commentId}(commentId=${comment.id})}" method="post">
								<button class="delete-btn">Delete</button>
							</form>

						</div>

					</div>

					<!-- COMMENT FORM (ALWAYS VISIBLE) -->
					<div class="comment-form">
						<form th:action="@{/comment/{postId}(postId=${post.id})}" method="post">
							<input type="text" name="content" placeholder="Write a comment..." required>
							<button type="submit">Post</button>
						</form>
					</div>

				</div>

				<div th:if="${currentUserRole == 'CREATOR' or currentUserRole == 'BUSINESS'}" class="analytics-bar">

					<div class="analytics-item">
						👁 <span th:text="${post.reachCount}">0</span>
						<small>Reach</small>
					</div>

					<div class="analytics-item">
						🔁 <span th:text="${post.totalShares}">0</span>
						<small>Shares</small>
					</div>

					<div class="analytics-item">
						📊 <span th:text="${#numbers.formatDecimal(post.engagementRate,1,2)}">0</span>%
						<small>Engagement</small>
					</div>

				</div>

			</div>
		</div>

		<!-- ================= NOTIFICATION SIDEBAR ================= -->

		<div class="notification-sidebar">
			<div class="sidebar-header">

				<span class="sidebar-title">Notifications</span>

				<div class="sidebar-bell">
					🔔
					<sup id="sidebarNotifCount" class="sidebar-badge"></sup>
				</div>

			</div>
			<div class="notif-title">Unread</div>
			<div id="notifUnread"></div>
			<div class="notif-title">History</div>
			<div id="notifRead"></div>
		</div>

	</div>

	<script>

		function toggleProfileMenu() {
			document.getElementById("profileDropdown").classList.toggle("show");
		}

		function fetchNotifications() {
			fetch('/notifications')
				.then(res => res.json())
				.then(data => {

					let unread = data.filter(n => !n.read);
					let read = data.filter(n => n.read);

					renderNotifications(unread, read);

					updateSidebarNotificationCount(unread.length);
				});
		}

		function updateSidebarNotificationCount(count) {

			const badge = document.getElementById("sidebarNotifCount");

			if (count > 0) {
				badge.innerText = count;
				badge.style.display = "inline-block";
			} else {
				badge.style.display = "none";
			}
		}

		function renderNotifications(unread, read) {

			const unreadBox = document.getElementById("notifUnread");
			const readBox = document.getElementById("notifRead");

			unreadBox.innerHTML = "";
			readBox.innerHTML = "";

			unread.forEach(n => unreadBox.appendChild(createItem(n, true)));
			read.forEach(n => readBox.appendChild(createItem(n, false)));
		}

		function createItem(n, unread) {

			let div = document.createElement("div");
			div.className = "notif-item " + (unread ? "unread" : "read");

			div.innerHTML = `<div class="notif-text">${n.message}</div>`;

			div.onclick = function () {
				fetch('/notifications/read/' + n.id, {method: 'POST'})
					.then(() => fetchNotifications());
			};

			return div;
		}

		setInterval(fetchNotifications, 5000);
		fetchNotifications();

		function toggleComments(postId) {
			let section = document.getElementById("comments-" + postId);
			if (!section) return;
			section.style.display =
				(section.style.display === "none" || section.style.display === "")
					? "block" : "none";
		}
	</script>
	<!-- ================= SCHEDULE ================= -->
	<!-- Schedule Overlay -->
	<div id="scheduleOverlay" class="schedule-overlay">

		<div class="schedule-sheet">

			<h3 style="margin-top:0;">Schedule Post</h3>

			<input type="datetime-local" id="schedulePicker" class="schedule-input">

			<div class="schedule-buttons">
				<button onclick="confirmSchedule()" class="ok-btn">
					OK
				</button>

				<button onclick="closeSchedule()" class="cancel-btn">
					Cancel
				</button>
			</div>

		</div>
	</div>

	<!-- App Popup -->
	<div id="appPopupOverlay" class="app-popup-overlay">
		<div class="app-popup">
			<div id="appPopupMessage"></div>
			<button onclick="closeAppPopup()">OK</button>
		</div>
	</div>


	<!-- SCRIPT (UNCHANGED) -->
	<script>


		function toggleComments(postId) {
			let section = document.getElementById("comments-" + postId);
			if (section.style.display === "none") {
				section.style.display = "block";
			} else {
				section.style.display = "none";
			}
		}
	</script>

	<script th:inline="javascript">

		let trendingTags = /*[[${trendingHashtags}]]*/[];
		if (!trendingTags) {
			trendingTags = [];
		}


		function handleSearchInput() {

			let input = document.getElementById("searchInput").value.trim();
			let box = document.getElementById("trendingBox");

			let trendingBtn = document.getElementById("dynamicTrendingBtn");

			if (input.startsWith("#")) {

				trendingBtn.style.display = "inline-block";

			} else {

				trendingBtn.style.display = "none";
			}

			// If not starting with #
			if (!input.startsWith("#")) {
				box.style.display = "none";
				return;
			}

			let keyword = input.substring(1).toLowerCase();

			let filtered = trendingTags.filter(tag =>
				tag.toLowerCase().startsWith(keyword)
			);

			if (filtered.length === 0) {
				box.style.display = "none";
				return;
			}

			box.innerHTML = "";

			filtered.forEach(tag => {

				let a = document.createElement("a");
				a.href = "/post/trending?tag=" + tag;
				a.innerText = "#" + tag;
				a.style.display = "block";
				a.style.padding = "8px";
				a.style.textDecoration = "none";
				a.style.color = "#111827";

				a.onmouseover = () => a.style.background = "#f3f4f6";
				a.onmouseout = () => a.style.background = "transparent";

				box.appendChild(a);
			});

		//	let trendingBtn = document.getElementById("dynamicTrendingBtn");

			if (!input.startsWith("#")) {
				trendingBtn.style.display = "none";
				box.style.display = "none";
				return;
			}

			trendingBtn.style.display = "inline-block";

			//let keyword = input.substring(1).toLowerCase();

		//	let filtered = trendingTags.filter(tag =>
			//	tag.toLowerCase().startsWith(keyword)
			//);

			if (filtered.length === 0) {
				box.style.display = "none";
				return;
			}

			box.innerHTML = "";  // ✅ No header

			filtered.forEach(tag => {
				let a = document.createElement("a");
				a.href = "/post/trending?tag=" + tag;
				a.innerText = "#" + tag;
				box.appendChild(a);
			});

			box.style.display = "block";
		}

		document.addEventListener("click", function (event) {

			let searchInput = document.getElementById("searchInput");
			let box = document.getElementById("trendingBox");

			if (!searchInput.contains(event.target) &&
				!box.contains(event.target)) {

				box.style.display = "none";
			}
		});
		/* ==============================
		   POST TEXTAREA HASHTAG SUGGEST
		============================== */
		function suggestHashtags() {

			let textarea = document.getElementById("postContent");
			let value = textarea.value;
			let suggestionBox = document.getElementById("hashtagSuggestions");

			let match = value.match(/#(\w*)$/);

			if (!match) {
				suggestionBox.style.display = "none";
				return;
			}

			let keyword = match[1].toLowerCase();

			let filtered = trendingTags.filter(tag =>
				tag.toLowerCase().startsWith(keyword)
			);

			if (filtered.length === 0) {
				suggestionBox.style.display = "none";
				return;
			}

			suggestionBox.innerHTML = "";

			filtered.forEach(tag => {

				let div = document.createElement("div");
				div.innerText = "#" + tag;
				div.style.padding = "6px";
				div.style.cursor = "pointer";

				div.onclick = function () {
					textarea.value =
						value.replace(/#(\w*)$/, "#" + tag + " ");
					suggestionBox.style.display = "none";
				};

				suggestionBox.appendChild(div);
			});

			suggestionBox.style.display = "block";
		}

	</script>
	<script>

		function openSchedule() {

			let content = document.getElementById("postContent").value.trim();

			// ❌ If content empty
			if (content === "") {
				showAppPopup("Content is required to schedule a post.");
				return;
			}

			// ✅ Show bottom sheet
			document.getElementById("scheduleOverlay").style.display = "flex";
		}

		function closeSchedule() {
			document.getElementById("scheduleOverlay").style.display = "none";
		}

		function confirmSchedule() {

			let dateTime = document.getElementById("schedulePicker").value;


			if (!dateTime) {
				showAppPopup("Please select date and time.");
				return;
			}

			// Set hidden input
			document.getElementById("scheduledAtInput").value = dateTime;

			closeSchedule();

			// Show success toast
			showToast("Post scheduled successfully!");

			// Submit form after small delay (better UX)
			setTimeout(() => {
				document.querySelector(".create-post form").submit();
			}, 800);
		}


		/* =========================
		   APP POPUP (Error Style)
		========================= */

		function showAppPopup(message) {

			document.getElementById("appPopupMessage").innerText = message;
			document.getElementById("appPopupOverlay").style.display = "flex";
		}

		function closeAppPopup() {
			document.getElementById("appPopupOverlay").style.display = "none";
		}


		/* =========================
		   TOAST SUCCESS MESSAGE
		========================= */

		function showToast(message) {

			let toast = document.createElement("div");

			toast.innerText = message;
			toast.style.position = "fixed";
			toast.style.bottom = "30px";
			toast.style.left = "50%";
			toast.style.transform = "translateX(-50%)";
			toast.style.background = "#111827";
			toast.style.color = "white";
			toast.style.padding = "10px 20px";
			toast.style.borderRadius = "20px";
			toast.style.boxShadow = "0 4px 15px rgba(0,0,0,0.3)";
			toast.style.zIndex = "3000";
			toast.style.opacity = "0";
			toast.style.transition = "opacity 0.3s ease";

			document.body.appendChild(toast);

			setTimeout(() => toast.style.opacity = "1", 50);

			setTimeout(() => {
				toast.style.opacity = "0";
				setTimeout(() => toast.remove(), 300);
			}, 2000);
		}


	</script>

	<!--this is the filter type post-->

	<script>
		function changeRoleFilter(role) {
			if (role === "ALL")
				window.location.href = "/feed";
			else
				window.location.href = "/feed?role=" + role;
		}

		document.addEventListener("DOMContentLoaded", function () {

			const params = new URLSearchParams(window.location.search);
			let role = params.get("role");

			if (!role) role = "ALL";

			document.querySelectorAll(".filter-btn").forEach(btn => {
				if (btn.innerText.toUpperCase().includes(role)) {
					btn.classList.add("active");
				}
			});

		});
	</script>

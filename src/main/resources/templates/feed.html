<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>RevConnect - Feed</title>
    <link rel="stylesheet" th:href="@{/css/feed.css}">

    <style>

        /* ====== PAGE LAYOUT ====== */
        .page-layout {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding-top: 20px;
        }

        .feed-container {
            width: 650px;
        }

        /* ===== RIGHT SIDEBAR ===== */
        .notification-sidebar {
            width: 320px;
            height: calc(100vh - 80px);
            position: sticky;
            top: 70px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 15px;
            overflow-y: auto;
        }

        .sidebar-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .notif-title {
            font-size: 14px;
            color: #666;
            margin: 15px 0 8px 0;
            font-weight: 600;
        }

        .notif-item {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .notif-item:hover {
            background: #f5f7fb;
        }

        .notif-item.unread {
            background: #eef3ff;
        }

        .notif-item.read {
            background: #fafafa;
        }

        .notif-text {
            font-size: 14px;
        }

        .empty-text {
            font-size: 13px;
            color: #888;
            text-align: center;
        }

        /* ===== ANALYTICS BAR ===== */

        .analytics-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 12px;
            padding: 10px;
            background: linear-gradient(90deg, #eef2ff, #f8f9ff);
            border-radius: 10px;
            font-size: 14px;
            border: 1px solid #e5e8f0;
        }

        .analytics-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .analytics-item span {
            font-weight: 600;
            font-size: 16px;
        }

        .analytics-item small {
            font-size: 11px;
            color: #777;
        }

    </style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<div class="navbar">
    <div class="navbar-left">
        <h2 class="logo">RevConnect</h2>

        <form th:action="@{/profile/search}" method="get" class="search-form">
            <input type="text" name="keyword" placeholder="Search users..." required>
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="navbar-right">
        <a th:href="@{/connections}">Pending</a>
        <a th:href="@{/connections/accepted}">Connections</a>

        <div class="profile-menu">
            <div class="profile-circle"
                 onclick="toggleProfileMenu()"
                 th:text="${#strings.substring(currentUsername,0,1).toUpperCase()}">
            </div>

            <div id="profileDropdown" class="dropdown">
                <a th:href="@{/profile}">My Profile</a>
                <a th:href="@{/logout}">Logout</a>
            </div>
        </div>
    </div>
</div>

<!-- ================= MAIN LAYOUT ================= -->

<div class="page-layout">

    <!-- ================= FEED ================= -->

    <div class="feed-container">

        <!-- CREATE POST -->
        <div class="create-post">
            <form th:action="@{/post/create}" method="post">
                <div class="create-row">
                    <div class="avatar">
                        <span th:text="${#strings.substring(currentUsername,0,1).toUpperCase()}"></span>
                    </div>
                    <textarea name="content" placeholder="What's on your mind?" required></textarea>
                </div>

                <div class="create-actions">
                    <div class="create-icons">📷 📄 #</div>
                    <button type="submit">Post</button>
                </div>
            </form>
        </div>

        <!-- POSTS -->
        <div th:each="post : ${posts}" class="post-card">

            <div class="post-top">
                <div class="avatar small">
                    <span th:text="${#strings.substring(post.username,0,1).toUpperCase()}"></span>
                </div>

                <div class="post-meta">
                    <a th:href="@{/profile/{username}(username=${post.username})}"
                       th:text="${post.username}"></a>
                    <span th:text="${#temporals.format(post.createdAt,'dd MMM yyyy HH:mm')}"></span>
                </div>
            </div>

            <div class="post-content"
                 th:text="${post.content}"></div>

            <!-- ACTIONS -->
            <div class="post-actions">

                <form th:action="@{/like/{postId}(postId=${post.id})}" method="post">
                    <button th:text="${post.likedByCurrentUser ? '❤️ Unlike' : '🤍 Like'}"></button>
                </form>

                <span th:text="${post.likeCount} + ' likes'"></span>

                <span class="comment-toggle"
                      th:attr="onclick='toggleComments(' + ${post.id} + ')'">
                    💬 <span th:text="${#lists.size(post.comments)}"></span> Comments
                </span>

                <form th:action="@{/post/share/{id}(id=${post.id})}" method="post">
                    <button>🔁 Share</button>
                </form>

                <form th:if="${post.username == currentUsername}"
                      th:action="@{/post/delete/{id}(id=${post.id})}"
                      method="post">
                    <button>🗑 Delete</button>
                </form>

            </div>
			<div class="comment-section">

			          <div th:each="comment : ${post.comments}" class="comment">
			              <strong>
			                  <a th:href="@{/profile/{username}(username=${comment.username})}"
			                     th:text="${comment.username}"></a>
			              </strong> :
			              <span th:text="${comment.content}"></span>

			              <form th:if="${comment.ownedByCurrentUser}"
			                    th:action="@{/comment/delete/{commentId}(commentId=${comment.id})}"
			                    method="post" style="display:inline;">
			                  <button type="submit" class="delete-btn">Delete</button>
			              </form>
			          </div>

			          <div class="comment-form">
			              <form th:action="@{/comment/{postId}(postId=${post.id})}" method="post">
			                  <input type="text" name="content" placeholder="Write a comment..." required />
			                  <button type="submit">Post</button>
			              </form>
			          </div>

			      </div>

            <!-- 🔥 ANALYTICS BAR -->
			<div th:if="${currentUserRole == 'CREATOR' or currentUserRole == 'BUSINESS'}"
			     class="analytics-bar">
				 
                <div class="analytics-item">
                    👁 <span th:text="${post.reachCount}">0</span>
                    <small>Reach</small>
                </div>

                <div class="analytics-item">
                    🔁 <span th:text="${post.totalShares}">0</span>
                    <small>Shares</small>
                </div>

                <div class="analytics-item">
                    📊 <span th:text="${#numbers.formatDecimal(post.engagementRate,1,2)}">0</span>%
                    <small>Engagement</small>
                </div>

            </div>

        </div>
    </div>

    <!-- ================= NOTIFICATION SIDEBAR ================= -->

    <div class="notification-sidebar">
        <div class="sidebar-header">Notifications</div>
        <div class="notif-title">Read</div>
        <div id="notifUnread"></div>
        <div class="notif-title">Unread</div>
        <div id="notifRead"></div>
    </div>

</div>

<script>

    function toggleProfileMenu() {
        document.getElementById("profileDropdown").classList.toggle("show");
    }

    function fetchNotifications() {
        fetch('/notifications')
            .then(res => res.json())
            .then(data => {
                let unread = data.filter(n => !n.read);
                let read = data.filter(n => n.read);
                renderNotifications(unread, read);
            });
    }

    function renderNotifications(unread, read) {

        const unreadBox = document.getElementById("notifUnread");
        const readBox = document.getElementById("notifRead");

        unreadBox.innerHTML = "";
        readBox.innerHTML = "";

        unread.forEach(n => unreadBox.appendChild(createItem(n, true)));
        read.forEach(n => readBox.appendChild(createItem(n, false)));
    }

    function createItem(n, unread) {

        let div = document.createElement("div");
        div.className = "notif-item " + (unread ? "unread" : "read");

        div.innerHTML = `<div class="notif-text">${n.message}</div>`;

        div.onclick = function () {
            fetch('/notifications/read/' + n.id, {method: 'POST'})
                .then(() => fetchNotifications());
        };

        return div;
    }

    setInterval(fetchNotifications, 5000);
    fetchNotifications();

    function toggleComments(postId) {
        let section = document.getElementById("comments-" + postId);
        if (!section) return;
        section.style.display =
            (section.style.display === "none" || section.style.display === "")
                ? "block" : "none";
    }

</script>

</body>
</html>

<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notification Settings</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

    body{
        margin:0;
        padding:0;
        font-family:'Poppins', sans-serif;
        background:linear-gradient(135deg,#dfe9f3,#ffffff);
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .card{
        background:white;
        width:430px;
        padding:30px;
        border-radius:18px;
        box-shadow:0 12px 35px rgba(0,0,0,0.18);
    }

    h2{
        text-align:center;
        color:#333;
        margin-bottom:25px;
    }

    .setting{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:12px 0;
        border-bottom:1px solid #eee;
        font-size:16px;
        color:#444;
    }

    .setting:last-child{
        border-bottom:none;
    }

    /* Toggle Switch */
    .switch{
        position:relative;
        display:inline-block;
        width:52px;
        height:26px;
    }

    .switch input{
        opacity:0;
        width:0;
        height:0;
    }

    .slider{
        position:absolute;
        cursor:pointer;
        top:0;
        left:0;
        right:0;
        bottom:0;
        background:#ccc;
        transition:.4s;
        border-radius:34px;
    }

    .slider:before{
        position:absolute;
        content:"";
        height:20px;
        width:20px;
        left:3px;
        bottom:3px;
        background:white;
        transition:.4s;
        border-radius:50%;
        box-shadow:0 2px 6px rgba(0,0,0,0.3);
    }

    input:checked + .slider{
        background:linear-gradient(45deg,#4facfe,#00f2fe);
    }

    input:checked + .slider:before{
        transform:translateX(26px);
    }

    /* Status message */
    #statusMessage{
        text-align:center;
        margin-top:18px;
        font-size:14px;
        font-weight:500;
        height:18px;
    }

    .saving{
        color:#555;
    }

    .success{
        color:#1db954;
    }

    .error{
        color:#ff4d4f;
    }

    .back{
        display:block;
        text-align:center;
        margin-top:18px;
        text-decoration:none;
        color:#4facfe;
    }

    .back:hover{
        text-decoration:underline;
    }

</style>
</head>

<body>

<div class="card">

<h2>🔔 Notification Preferences</h2>

<div class="setting">
    <span>Like Notifications</span>
    <label class="switch">
        <input type="checkbox" id="likeToggle">
        <span class="slider"></span>
    </label>
</div>

<div class="setting">
    <span>Comment Notifications</span>
    <label class="switch">
        <input type="checkbox" id="commentToggle">
        <span class="slider"></span>
    </label>
</div>

<div class="setting">
    <span>Follow Notifications</span>
    <label class="switch">
        <input type="checkbox" id="followToggle">
        <span class="slider"></span>
    </label>
</div>

<div id="statusMessage"></div>

<a class="back" th:href="@{/feed}">← Back to Feed</a>


</div>

<script>

async function loadPreferences() {

    try{
        const response = await fetch("/notification-preferences");
        const pref = await response.json();

        document.getElementById("likeToggle").checked = pref.likeEnabled;
        document.getElementById("commentToggle").checked = pref.commentEnabled;
        document.getElementById("followToggle").checked = pref.followEnabled;
    }
    catch(e){
        console.log("Could not load preferences");
    }
}

async function updatePreferences(){

    const status = document.getElementById("statusMessage");

    // show saving
    status.className = "saving";
    status.innerText = "Saving...";

    try{

        const response = await fetch("/notification-preferences", {
            method:"PUT",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                likeEnabled: document.getElementById("likeToggle").checked,
                commentEnabled: document.getElementById("commentToggle").checked,
                followEnabled: document.getElementById("followToggle").checked
            })
        });

        if(!response.ok){
            throw new Error();
        }

        status.className = "success";
        status.innerText = "✔ Preferences Saved";

        // hide after 2 sec
        setTimeout(()=>status.innerText="",2000);

    }catch(err){

        status.className = "error";
        status.innerText = "✖ Failed to Save";
    }
}

// Auto-save when toggled (same as your current behavior)
document.getElementById("likeToggle").addEventListener("change", updatePreferences);
document.getElementById("commentToggle").addEventListener("change", updatePreferences);
document.getElementById("followToggle").addEventListener("change", updatePreferences);

loadPreferences();

</script>

</body>
</html>

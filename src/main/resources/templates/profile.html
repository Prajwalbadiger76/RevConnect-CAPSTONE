<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .profile-card {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
        }

        .counts {
            margin: 15px 0;
            font-weight: bold;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 5px;
            text-decoration: none;
            margin-right: 8px;
            display: inline-block;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .post-card {
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .pinned-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 12px;
            margin-left: 8px;
        }

    </style>
</head>
<body>

<div class="profile-card">

    <h2 th:text="${profile.fullName} ?: ${profile.username}"></h2>

    <p><strong>@</strong><span th:text="${profile.username}"></span></p>
    <p><strong>Email:</strong> <span th:text="${profile.email}"></span></p>
    <p><strong>Role:</strong> <span th:text="${profile.role}"></span></p>
    <p><strong>Bio:</strong> <span th:text="${profile.bio}"></span></p>

    <div class="counts">
        Followers: <span th:text="${profile.followerCount}"></span> |
        Following: <span th:text="${profile.followingCount}"></span> |
        Connections: <span th:text="${connectionCount}"></span>
    </div>

    <!-- Edit Button -->
    <div th:if="${profile.isOwnProfile}">
        <a th:href="@{/profile/edit}" class="btn btn-secondary">Edit Profile</a>
    </div>

    <!-- Follow + Connection Section (UNCHANGED) -->
    <div th:if="${!profile.isOwnProfile}">

        <form th:if="${!profile.isFollowing}"
              th:action="@{/follow/{username}(username=${profile.username})}"
              method="post">
            <button type="submit" class="btn btn-primary">Follow</button>
        </form>

        <form th:if="${profile.isFollowing}"
              th:action="@{/follow/unfollow/{username}(username=${profile.username})}"
              method="post">
            <button type="submit" class="btn btn-danger">Unfollow</button>
        </form>

        <!-- CONNECTION SECTION -->
        <form th:if="${connectionStatus == 'NONE'}"
              th:action="@{/connections/send/{username}(username=${profile.username})}"
              method="post">
            <button type="submit" class="btn btn-primary">Connect</button>
        </form>

        <button th:if="${connectionStatus == 'PENDING' and pendingRequestId == null}"
                class="btn btn-secondary"
                disabled>
            Pending
        </button>

        <div th:if="${connectionStatus == 'PENDING' and pendingRequestId != null}">
            <form th:action="@{/connections/accept/{id}(id=${pendingRequestId})}"
                  method="post" style="display:inline;">
                <button type="submit" class="btn btn-primary">Accept</button>
            </form>

            <form th:action="@{/connections/reject/{id}(id=${pendingRequestId})}"
                  method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger">Reject</button>
            </form>
        </div>

        <button th:if="${connectionStatus == 'ACCEPTED'}"
                class="btn btn-secondary"
                disabled>
            Connected
        </button>

    </div>

    <br>
    <a th:href="@{/feed}" class="btn btn-secondary">Back to Feed</a>
    <a th:href="@{/logout}" class="btn btn-secondary">Logout</a>

</div>

<!-- ================= USER POSTS SECTION ================= -->

<div th:if="${posts != null}">

    <h3 style="margin-top:30px;">Posts</h3>

    <div th:each="post : ${posts}" class="post-card">

        <div>
            <span th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy HH:mm')}"></span>

            <!-- PIN BADGE -->
            <span th:if="${post.pinned}" class="pinned-badge">
                📌 Pinned
            </span>
        </div>

        <p th:text="${post.content}"></p>

        <!-- PIN / UNPIN only if own profile -->
        <div th:if="${profile.isOwnProfile}">

            <form th:if="${!post.pinned}"
                  th:action="@{/post/pin/{id}(id=${post.id})}"
                  method="post"
                  style="display:inline;">
                <button type="submit" class="btn btn-secondary">📌 Pin</button>
            </form>

            <form th:if="${post.pinned}"
                  th:action="@{/post/unpin/{id}(id=${post.id})}"
                  method="post"
                  style="display:inline;">
                <button type="submit" class="btn btn-danger">❌ Unpin</button>
            </form>

        </div>

    </div>

</div>

</body>
</html>

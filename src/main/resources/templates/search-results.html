<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Search Results</title>
    <link rel="stylesheet" th:href="@{/css/feed.css}">

    <style>
        body {
            background: #DFE9EB;
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            color: #1f2937;
        }

        /* ===== PAGE WRAPPER (Below Navbar) ===== */
        .search-wrapper {
            margin-top: 100px;   /* Push below header */
            margin-bottom: 80px; /* Space before footer */
        }

        .search-container {
            max-width: 650px;
            margin: 0 auto 420px auto;
            padding: 0 20px;
			
        }

        /* ===== BACK LINK ===== */
        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            text-decoration: none;
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
            transition: 0.2s ease;
        }

        .back-link:hover {
            color: #2563eb;
        }

        /* ===== USER CARD (Followers Style) ===== */
        .user-card {
            background: white;
            padding: 18px 22px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.25s ease;
        }

        .user-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.10);
            background: #fafbff;
        }

        .user-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            text-transform: uppercase;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            color: #111827;
        }

        .username:hover {
            color: #2563eb;
        }

        .full-name {
            font-size: 13px;
            color: #6b7280;
        }

        .followers-count {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
			margin: 0px;
        }

        /* ===== HASHTAG POST CARD ===== */
        .post-card {
            background: white;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .post-content {
            font-size: 14px;
            margin: 8px 0;
        }

        .post-actions {
            display: flex;
            gap: 16px;
            font-size: 13px;
            margin-top: 10px;
        }

        .post-actions button {
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div th:replace="fragments/header :: header"></div>

<div class="search-wrapper">
    <div class="search-container">

        <a th:href="@{/feed}" class="back-link">← Back to Feed</a>

        <!-- ================= USER SEARCH ================= -->

        <div th:if="${searchType != 'hashtag' and #lists.isEmpty(results)}">
            No users found.
        </div>

        <div th:if="${searchType != 'hashtag'}"
             th:each="user : ${results}"
             class="user-card">

            <div class="user-left">

                <div class="avatar"
                     th:text="${#strings.substring(user.username,0,1)}">
                </div>

                <div class="user-info">
                    <a th:href="@{/profile/{username}(username=${user.username})}"
                       th:text="${user.username}"
                       class="username">
                    </a>

                    <span th:text="${user.fullName}" class="full-name"></span>
                </div>

            </div>

            <div class="followers-count">
                <span th:text="${user.followerCount}"></span> followers
            </div>

        </div>

        <!-- ================= HASHTAG SEARCH ================= -->

        <div th:if="${searchType == 'hashtag'}">

            <div style="margin-bottom:20px; font-weight:600; font-size:16px;">
                Showing results for
                <span th:text="${searchedKeyword}" style="color:#2563eb;"></span>
            </div>

            <div th:if="${#lists.isEmpty(posts)}">
                No posts found for this hashtag.
            </div>

            <div th:each="post : ${posts}" class="post-card">

                <div class="post-header">
                    <div class="avatar"
                         th:text="${#strings.substring(post.username,0,1)}">
                    </div>

                    <div>
                        <strong th:text="${post.username}"></strong>
                        <div th:text="${#temporals.format(post.createdAt,'dd MMM yyyy HH:mm')}"></div>
                    </div>
                </div>

                <div class="post-content"
                     th:text="${post.content}">
                </div>

                <div class="post-actions">

                    <form th:action="@{/like/{postId}(postId=${post.id})}" method="post">
                        <button th:text="${post.likedByCurrentUser ? '❤️ Unlike' : '🤍 Like'}"></button>
                    </form>

                    <span th:text="${post.likeCount} + ' likes'"></span>

                </div>

            </div>

        </div>

    </div>
</div>

<!-- FOOTER -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
